[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coprompter"
version = "0.1.0"
description = "A small asynchronous client for vLLM's OpenAI-compatible chat API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.3.0",
]

[project.scripts]
coprompter = "coprompter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coprompter = ["py.typed"]
